[package]
name = "household-audio-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
async-stream = "=0.3.6"
async-trait = "=0.1.88"
axum = "=0.8.4"
futures-core = "=0.3.31"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "=0.1.3"
jsonschema = { version = "=0.29.1", default-features = false }
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
