[server]
threads = -1
datadir = /var/lib/snapserver
mdns_enabled = false

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 11780
publish_http = false
doc_root = /usr/share/snapserver/snapweb

[tcp-control]
enabled = true
bind_to_address = 0.0.0.0
port = 11705
publish = false

[tcp-streaming]
enabled = true
bind_to_address = 0.0.0.0
port = 11704
publish = false

[stream]
# An intentionally silent default keeps new groups idle until explicitly switched.
source = pipe:///tmp/household-audio-idle.pcm?name=idle&mode=create&sampleformat=48000:32:2&codec=flac
# Raw little-endian signed PCM from the AirPlay bridge (no WAV header).
source = tcp://0.0.0.0:14953?name=AirPlay&mode=server&sampleformat=48000:32:2&codec=flac
# Synthetic multiroom-audio/test ingress, kept separate from the production bridge.
source = tcp://0.0.0.0:14954?name=MA-Test-PCM&mode=server&sampleformat=48000:32:2&codec=flac
default_source = idle
sampleformat = 48000:32:2
codec = flac
chunk_ms = 20
buffer = 1000

[logging]
sink = stdout
filter = *:info
